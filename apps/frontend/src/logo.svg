<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Outer Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Pillar 1 Gradient (Electric Indigo to Vivid Cyan) -->
    <linearGradient id="p1-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Pillar 2 Gradient (Cyan to Electric Indigo) -->
    <linearGradient id="p2-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Wave Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Obsidian Container with Rounded Corners (Squircle) -->
  <rect width="64" height="64" rx="16" fill="#090A0F" />
  
  <!-- Subtle Glowing Border for High Contrast on both Dark and Light Browser Chrome -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="32" cy="32" r="22" fill="url(#ambient-glow)" />

  <!-- Left Vertical Pillar of 'H' -->
  <rect x="15" y="14" width="8.5" height="36" rx="4.25" fill="url(#p1-grad)" />

  <!-- Right Vertical Pillar of 'H' -->
  <rect x="40.5" y="14" width="8.5" height="36" rx="4.25" fill="url(#p2-grad)" />

  <!-- Central Horizontal Connector Beam -->
  <rect x="19" y="28" width="26" height="8" rx="4" fill="url(#beam-grad)" />

  <!-- Dynamic AI Voice Frequency Waveform in Center -->
  <!-- Left Frequency Bar -->
  <rect x="25.25" y="23" width="3.5" height="18" rx="1.75" fill="#A5B4FC" />
  <!-- Center Peak Frequency Bar -->
  <rect x="30.25" y="17" width="3.5" height="30" rx="1.75" fill="#38BDF8" />
  <!-- Right Frequency Bar -->
  <rect x="35.25" y="23" width="3.5" height="18" rx="1.75" fill="#A5B4FC" />

  <!-- Core White Audio Signal Pulse Spark -->
  <circle cx="32" cy="32" r="2.2" fill="#FFFFFF" opacity="0.95" />
</svg>
